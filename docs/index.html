<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISCOVERIES</title>
<meta name="description" content="A travel guide to Japan's most beautiful landscapes, by region and by season. Available in six languages.">
<script>
// Send visitors to their language: a saved choice first, then the browser's languages, then English.
(function () {
  var slugs = { "ja": "ja", "en": "en", "zh-Hans": "zh-hans", "zh-Hant": "zh-hant", "fr": "fr", "es": "es" };
  function match(tag) {
    if (!tag) return null;
    var t = tag.toLowerCase();
    if (t.indexOf("zh") === 0) return /hant|tw|hk|mo/.test(t) ? "zh-Hant" : "zh-Hans";
    var base = t.split("-")[0];
    return slugs[base] ? base : null;
  }
  var lang = null;
  try { lang = localStorage.getItem("discoveries-lang"); } catch (e) {}
  if (!slugs[lang]) {
    lang = null;
    var prefs = navigator.languages || [navigator.language];
    for (var i = 0; i < prefs.length && !lang; i++) lang = match(prefs[i]);
  }
  location.replace(slugs[lang || "en"] + "/" + location.hash);
})();
</script>
<link rel="stylesheet" href="css/style.css">
<style>
  .chooser { min-height: 100vh; display: grid; place-content: center; gap: 28px; padding: 24px; text-align: center; }
  .chooser ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .chooser li a { display: block; padding: 10px 22px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); text-decoration: none; }
  .chooser li a:hover { border-color: var(--shu); color: var(--shu); }
</style>
</head>
<body>
<!-- Shown only when the redirect above cannot run (no JavaScript); also gives search engines a link to every language. -->
<main class="chooser">
  <p class="brand" style="justify-content:center"><span class="brand-mark" aria-hidden="true"></span>DISCOVERIES</p>
  <ul>
    <li><a href="ja/" lang="ja" hreflang="ja">日本語</a></li>
    <li><a href="en/" lang="en" hreflang="en">English</a></li>
    <li><a href="zh-hans/" lang="zh-Hans" hreflang="zh-Hans">简体中文</a></li>
    <li><a href="zh-hant/" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a></li>
    <li><a href="fr/" lang="fr" hreflang="fr">Français</a></li>
    <li><a href="es/" lang="es" hreflang="es">Español</a></li>
  </ul>
</main>
</body>
</html>
